[tool.pytest.ini_options]
markers = [
    "functional: tests that require external API calls (deselect with '-m \"not functional\"')",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
    "pip-audit==2.10.0",
    "pylint-pydantic==0.4.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-coverage==0.0",
]
