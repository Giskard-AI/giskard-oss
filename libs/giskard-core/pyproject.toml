[project]
name = "giskard-core"
version = "1.0.3"
description = "Core shared utilities and foundational components for the Giskard library ecosystem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "posthog>=7.10.3,<8",
    "pydantic>=2.11.0,<3",
]

[tool.deptry]
known_first_party = ["giskard"]  # giskard.* is a PEP 420 namespace shared by all workspace libs

[tool.deptry.per_rule_ignores]
"DEP003" = [
    "pydantic_core",  # part of pydantic's public API; pydantic pins pydantic-core exactly, so declaring it would only constrain pydantic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "W", "I", "F"]
extend-select = ["D"]  # pydocstyle: validate docstring format (NumPy convention)
ignore = ["E501", "D1"]  # D1: missing docstrings are not enforced yet

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort.sections]
"my_packages" = ["giskard"]

[tool.pyright]
failOnWarnings = false
typeCheckingMode = "recommended"
reportImportCycles = "warning"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giskard"]

[tool.hatch.build.targets.sdist]
include = [
  "src/giskard/core",
  "README.md",
  "pyproject.toml",
]
