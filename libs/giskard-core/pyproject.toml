[project]
name = "giskard-core"
version = "1.0.1b6"
description = "Core shared utilities and foundational components for the Giskard library ecosystem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "posthog>=7.10.3",
    "pydantic>=2.11.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "W", "I", "F", "D"]
ignore = ["E501", "D1"]
# D1 (missing docstrings) is enforced on the public API only, by
# tools/check_public_docstrings.py; here we enforce NumPy section style
# wherever a docstring exists.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]


[tool.ruff.lint.isort.sections]
"my_packages" = ["giskard"]

[tool.pyright]
failOnWarnings = false
typeCheckingMode = "recommended"
reportImportCycles = "warning"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giskard"]

[tool.hatch.build.targets.sdist]
include = [
  "src/giskard/core",
  "README.md",
  "pyproject.toml",
]
