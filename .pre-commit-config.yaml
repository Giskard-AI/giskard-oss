repos:
  # General pre-commit hooks (apply to all files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Python hooks for giskard-core
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^libs/giskard-core/
      - id: ruff-format
        files: ^libs/giskard-core/

  # Python type checking for giskard-core
  - repo: local
    hooks:
     - id: basedpyright
       name: basedpyright
       entry: bash -c 'cd libs/giskard-core && uv run basedpyright --level error .'
       language: system
       files: ^libs/giskard-core/

  # Security and secrets scanning for giskard-core
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", "libs/giskard-core/.secrets.baseline"]
        files: ^libs/giskard-core/
        exclude: |
          (?x)^(
            .*\.lock$|
            .*\.log$|
            .*\.dump$|
            .*/\.venv/.*|
            .*/\.uv/.*|
            .*/dist/.*|
            .*/build/.*|
            \.secrets\.baseline$|
            \.python-version$|
            venv\.lock$|
            version\.json$
          )$

