name: Guard maintainer labels

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no code execution — only removes a label applied by a non-maintainer
    types: [labeled]

permissions: {}

# Keyed by label: a shared per-PR group would let any later label event cancel the guard before it removes the label.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    if: contains(fromJSON('["safe for build", "safe for merge"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # remove label from PR
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Maintainers are collaborators with the admin or maintain role on this repo
            // (permission flags, so custom roles based on these count too).
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.sender.login
            }).catch((error) => {
              core.warning(`Could not read the role of ${context.payload.sender.login}: ${error.message}`);
              return { data: {} };
            });
            if (data.user?.permissions?.admin || data.user?.permissions?.maintain) {
              return;
            }
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: context.payload.label.name
              });
            } catch (error) {
              // Label already removed (e.g. by another guard run).
              if (error.status !== 404) {
                throw error;
              }
            }
