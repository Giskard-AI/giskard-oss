name: Guard 'safe for merge' label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no code execution — only removes a label applied by a non-maintainer
    types: [labeled]

permissions: {}

# No concurrency group: any later label event on the PR would cancel a guard run before it removes the label.

jobs:
  guard:
    name: guard
    # Approver logins; contains() compares case-insensitively.
    if: >-
      github.event.label.name == 'safe for merge' &&
      !contains(fromJSON('["kevinmessiaen", "henchaves", "pierlj", "hartorn"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # remove label from PR
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'safe for merge'
              });
            } catch (error) {
              // Label already removed (e.g. by another guard run).
              if (error.status !== 404) {
                throw error;
              }
            }
