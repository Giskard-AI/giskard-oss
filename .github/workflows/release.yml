name: Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Library to release'
        required: true
        type: choice
        options:
          - giskard-core
          - giskard-agents
          - giskard-checks
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - none
        default: patch
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - none
        default: none
      dry_run:
        description: 'If true, the release will not be published to PyPI'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.package }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ github.event.inputs.package }}
      BUMP_TYPE: ${{ github.event.inputs.bump_type }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}
      TEST_MODEL: "gemini/gemini-2.0-flash"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check if organization member
        id: is_organization_member
        uses: JamesSingleton/is-organization-member@311430b0670cdec4036e721029b78018236a0b74 # 1.1.0
        with:
          organization: Giskard-AI
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT_TOKEN }} # Needed to trigger other actions

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7
        with:
          python-version: "3.12"

      - name: Setup development environment
        run: make setup

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test

      - name: Bump version
        id: bump
        working-directory: libs/${{ env.PACKAGE }}
        run: |
          CMD=("uv" "version")

          if [ "${{ github.event.inputs.bump_type }}" != "none" ]; then
            CMD+=("--bump ${{ github.event.inputs.bump_type }}")
          fi

          if [ "${{ github.event.inputs.release_type }}" != "none" ] && [ -n "${{ github.event.inputs.release_type }}" ]; then
            CMD+=("--bump" "${{ github.event.inputs.release_type }}")
          fi

          if [ ${#CMD[@]} -gt 2 ]; then
            "${CMD[@]}"
          else
            echo "No version bump"
            exit 1
          fi

          NEW_VERSION=$(uv version --short)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=${{ env.PACKAGE }}/v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        working-directory: libs/${{ env.PACKAGE }}
        run: |
          uv build

      - name: Commit version bump
        working-directory: libs/${{ env.PACKAGE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "pyproject.toml"
          git commit -m "chore(${{ env.PACKAGE }}): bump version to ${{ steps.bump.outputs.new_version }}"

      - name: Push to main
        if: ${{ github.event.inputs.dry_run == false && github.ref_name == 'main' }}
        run: |
          git push origin main

      - name: Create tag
        if: ${{ github.event.inputs.dry_run == false }}
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"


      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run == false }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "${{ env.PACKAGE }} v${{ steps.bump.outputs.new_version }}"
          generate_release_notes: true
          files: |
            libs/${{ env.PACKAGE }}/dist/*.tar.gz
            libs/${{ env.PACKAGE }}/dist/*.whl
      
      - name: Push to Test PyPI (dry run)
        working-directory: libs/${{ env.PACKAGE }}
        env:
          PIPY_USERNAME: ${{ secrets.PIPY_USERNAME }}
          PIPY_PASSWORD: ${{ secrets.PIPY_PASSWORD }}
        run: uv publish --username "$PIPY_USERNAME" --password "$PIPY_PASSWORD" --publish-url https://test.pypi.org/legacy/
      
      - name: Push to PyPI
        if: ${{ github.event.inputs.dry_run == false }}
        working-directory: libs/${{ env.PACKAGE }}
        env:
          PIPY_USERNAME: ${{ secrets.PIPY_USERNAME }}
          PIPY_PASSWORD: ${{ secrets.PIPY_PASSWORD }}
        run: uv publish --username "$PIPY_USERNAME" --password "$PIPY_PASSWORD"