name: Main CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      # write: push auto-format commits on same-repo PRs only (guarded below; unused on forks/main)
      contents: write
    timeout-minutes: 10
    env:
      SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      format_pushed: ${{ steps.autofix.outputs.pushed }}
    steps:
      - name: Checkout (same-repo PR)
        if: env.SAME_REPO_PR == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Immutable SHA (not head_ref) to avoid ref injection; push targets BRANCH below
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout (check-only)
        if: env.SAME_REPO_PR != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install install-tools

      - name: Format and commit
        if: env.SAME_REPO_PR == 'true'
        id: autofix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          make format
          if git diff --quiet && git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Check (same-repo PR)
        if: env.SAME_REPO_PR == 'true' && steps.autofix.outputs.pushed != 'true'
        run: make check

      - name: Check (forks / main / dispatch)
        if: env.SAME_REPO_PR != 'true'
        run: make check

  test-unit:
    name: test-unit / ${{ matrix.package }} / ${{ matrix.python-version }}
    needs: lint
    if: needs.lint.outputs.format_pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        package: [giskard-core, giskard-llm, giskard-agents, giskard-checks, giskard-scan]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: make install
      - run: make test-unit PACKAGE=$PACKAGE

  test-minimal:
    name: test-minimal / ${{ matrix.package }}
    needs: lint
    if: needs.lint.outputs.format_pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [giskard-llm, giskard-agents, giskard-checks]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install-minimal
      - run: make test-unit-minimal PACKAGE=$PACKAGE

  test-no-providers:
    name: test-no-providers / giskard-llm
    needs: lint
    if: needs.lint.outputs.format_pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install-no-providers
      - run: make test-no-providers
