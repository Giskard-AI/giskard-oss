name: _Library Release Template
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string

concurrency:
  group: release-${{ inputs.package_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: get_version
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          PYPROJECT_PATH="libs/$PACKAGE_NAME/pyproject.toml"
          if [ ! -f "$PYPROJECT_PATH" ]; then
            echo "Error: pyproject.toml not found at $PYPROJECT_PATH"
            exit 1
          fi
          VERSION=$(grep '^version\s*=' "$PYPROJECT_PATH" | head -1 | cut -d '"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from $PYPROJECT_PATH"
            exit 1
          fi
          TAG_NAME="$PACKAGE_NAME/v$VERSION"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} does not exist, proceeding with release"
          fi

      - name: Install uv
        if: steps.check_tag.outputs.exists == 'false'
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7

      - name: Build package
        if: steps.check_tag.outputs.exists == 'false'
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          cd libs/$PACKAGE_NAME
          uv build

      - name: Create Release and Tag
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "${{ inputs.package_name }} v${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
          files: |
            libs/${{ inputs.package_name }}/dist/*.tar.gz
            libs/${{ inputs.package_name }}/dist/*.whl

      - name: Publish to PyPI
        if: steps.check_tag.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/${{ inputs.package_name }}/dist/
